<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z System Operations Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --primary:#006BFF; --primary-dim:#0052CC;
  --secondary:#02B07A;
  --accent:#7C3AED;
  --danger:#EF4444;
  --warning:#F59E0B;
  --bg:#0B1120;
  --bg-elevated:#0E1524;
  --card:#111827;
  --card-hover:#151F32;
  --border:rgba(255,255,255,0.08);
  --text:#FFFFFF;
  --text-secondary:#9CA3AF;
  --text-tertiary:#5B6472;
  --radius:20px;
  --radius-sm:12px;
  --shadow-glow:0 8px 32px rgba(0,107,255,0.15);
  --font-display:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
[data-theme="light"]{
  --bg:#F3F5F9;
  --bg-elevated:#FFFFFF;
  --card:#FFFFFF;
  --card-hover:#F8FAFC;
  --border:rgba(15,23,42,0.08);
  --text:#0F172A;
  --text-secondary:#5B6472;
  --text-tertiary:#94A3B8;
  --shadow-glow:0 8px 32px rgba(0,107,255,0.10);
}
*{margin:0;padding:0;box-sizing:border-box;}
svg{width:16px;height:16px;flex-shrink:0;display:inline-block;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:var(--font-display);
  background:var(--bg);
  color:var(--text);
  transition:background .35s ease,color .35s ease;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-tertiary);}

.app{display:flex;height:100vh;overflow:hidden;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:264px;flex-shrink:0;
  background:var(--bg-elevated);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:width .3s ease;
  position:relative;z-index:50;
  height:100vh;
}
.sidebar.collapsed{width:80px;}
.sidebar-header{
  display:flex;align-items:center;gap:12px;
  padding:22px 20px;border-bottom:1px solid var(--border);
  min-height:76px;
}
.logo-mark{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;color:#fff;
  box-shadow:0 4px 14px rgba(0,107,255,0.35);
}
.logo-text{overflow:hidden;white-space:nowrap;transition:opacity .2s;}
.logo-text .t1{font-weight:800;font-size:14.5px;letter-spacing:.3px;}
.logo-text .t2{font-size:10px;color:var(--text-secondary);letter-spacing:1.5px;font-weight:600;}
.sidebar.collapsed .logo-text{opacity:0;width:0;}

.nav-scroll{flex:1;padding:16px 12px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-radius:12px;margin-bottom:2px;
  color:var(--text-secondary);cursor:pointer;position:relative;
  transition:all .18s ease;font-size:14px;font-weight:500;
  white-space:nowrap;overflow:hidden;
}
.nav-item svg{flex-shrink:0;width:19px;height:19px;}
.nav-item:hover{background:var(--card-hover);color:var(--text);}
.nav-item.active{
  background:linear-gradient(135deg,rgba(0,107,255,0.16),rgba(124,58,237,0.10));
  color:var(--primary);font-weight:600;
}
.nav-item.active::before{
  content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:22px;border-radius:0 4px 4px 0;background:var(--primary);
  box-shadow:0 0 10px var(--primary);
}
.nav-badge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;
  font-weight:700;padding:2px 7px;border-radius:20px;
}
.sidebar.collapsed .nav-badge, .sidebar.collapsed .nav-label{display:none;}
.nav-divider{height:1px;background:var(--border);margin:12px 6px;}

.sidebar-footer{padding:14px;border-top:1px solid var(--border);}
.welcome-card{
  background:linear-gradient(135deg,var(--primary),var(--accent));
  border-radius:16px;padding:16px;color:#fff;position:relative;overflow:hidden;
}
.welcome-card::after{content:'';position:absolute;right:-20px;top:-20px;width:80px;height:80px;background:rgba(255,255,255,0.12);border-radius:50%;}
.welcome-card h4{font-size:13.5px;font-weight:700;margin-bottom:4px;}
.welcome-card p{font-size:11.5px;opacity:.9;margin-bottom:10px;line-height:1.4;}
.welcome-btn{
  background:rgba(255,255,255,0.18);border:none;color:#fff;font-size:12px;font-weight:600;
  padding:7px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:5px;
  transition:background .2s;
}
.welcome-btn:hover{background:rgba(255,255,255,0.28);}
.sidebar.collapsed .welcome-card{display:none;}
.copyright{font-size:10.5px;color:var(--text-tertiary);text-align:center;margin-top:12px;line-height:1.5;}
.sidebar.collapsed .copyright{display:none;}

.collapse-toggle{
  position:absolute;top:24px;right:-12px;width:26px;height:26px;border-radius:50%;
  background:var(--card);border:1px solid var(--border);cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--text-secondary);
  transition:all .2s;z-index:60;box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.collapse-toggle:hover{color:var(--primary);border-color:var(--primary);}
.collapse-toggle svg{width:14px;height:14px;transition:transform .3s;}
.sidebar.collapsed .collapse-toggle svg{transform:rotate(180deg);}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto;overflow-x:hidden;}
.topbar{
  height:76px;flex-shrink:0;display:flex;align-items:center;gap:16px;
  padding:0 28px;border-bottom:1px solid var(--border);
  background:var(--bg-elevated);position:sticky;top:0;z-index:40;
  backdrop-filter:blur(12px);
}
.search-box{
  flex:1;max-width:420px;display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:9px 14px;color:var(--text-secondary);cursor:pointer;transition:border-color .2s;
}
.search-box:hover{border-color:var(--primary);}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:13.5px;flex:1;font-family:inherit;}
.search-box input::placeholder{color:var(--text-tertiary);}
.kbd{
  font-family:var(--font-mono);font-size:10.5px;background:var(--bg);
  padding:2px 6px;border-radius:6px;border:1px solid var(--border);color:var(--text-tertiary);
}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.icon-btn{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;
  position:relative;transition:all .2s;
}
.icon-btn:hover{color:var(--primary);border-color:var(--primary);background:var(--card-hover);}
.icon-btn svg{width:18px;height:18px;}
.dot-badge{
  position:absolute;top:6px;right:7px;width:8px;height:8px;background:var(--danger);
  border-radius:50%;border:2px solid var(--bg-elevated);
}
.theme-switch{display:flex;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px;}
.theme-opt{
  width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-tertiary);transition:all .2s;
}
.theme-opt svg{width:15px;height:15px;}
.theme-opt.active{background:var(--primary);color:#fff;}
.profile-menu{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:14px;cursor:pointer;transition:background .2s;border:1px solid var(--border);position:relative;}
.profile-menu:hover{background:var(--card-hover);}
.avatar{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--primary));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;}
.profile-info{line-height:1.25;}
.profile-info .pname{font-size:13px;font-weight:600;}
.profile-info .prole{font-size:11px;color:var(--text-secondary);}

.page-content{flex:1;padding:26px 28px 40px;position:relative;}
.page{display:none;animation:fadeIn .35s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.breadcrumb{font-size:12.5px;color:var(--text-tertiary);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.breadcrumb span.cur{color:var(--text-secondary);font-weight:600;}

.hero-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:14px;}
.hero-title{font-size:26px;font-weight:800;display:flex;align-items:center;gap:8px;}
.hero-sub{color:var(--text-secondary);font-size:14px;margin-top:5px;}
.date-pill{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px 18px;text-align:center;min-width:150px;
}
.date-pill .dbig{font-size:14.5px;font-weight:700;}
.date-pill .dsmall{font-size:12px;color:var(--text-secondary);}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;transition:border-color .2s, transform .2s;
}
.card:hover{border-color:rgba(0,107,255,0.25);}
.section-title{font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.link-btn{font-size:12.5px;color:var(--primary);cursor:pointer;font-weight:600;background:none;border:none;font-family:inherit;}
.link-btn:hover{text-decoration:underline;}

.kpi-grid{display:grid;grid-template-columns:repeat(5, minmax(0,1fr));gap:16px;margin-bottom:22px;}
.kpi-grid-4{grid-template-columns:repeat(4, minmax(0,1fr));}
@media(max-width:1180px){
  .kpi-grid{grid-template-columns:repeat(3, minmax(0,1fr));}
  .kpi-grid-4{grid-template-columns:repeat(2, minmax(0,1fr));}
}
@media(max-width:640px){
  .kpi-grid,.kpi-grid-4{grid-template-columns:repeat(2, minmax(0,1fr));gap:10px;}
  .kpi-card{padding:14px;}
  .kpi-val{font-size:24px;}
  .kpi-icon{width:30px;height:30px;}
  .kpi-label{font-size:11.5px;}
  .kpi-trend{font-size:10.5px;}
}
@media(max-width:380px){
  .kpi-grid,.kpi-grid-4{grid-template-columns:1fr;}
}
.kpi-card{
  border-radius:18px;padding:18px;position:relative;overflow:hidden;cursor:default;
  transition:transform .25s ease, box-shadow .25s ease;border:1px solid var(--border);
}
.kpi-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-glow);}
.kpi-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.kpi-label{font-size:12.5px;font-weight:600;opacity:.85;}
.kpi-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;}
.kpi-icon svg{width:17px;height:17px;}
.kpi-val{font-size:30px;font-weight:800;font-family:var(--font-mono);margin-bottom:4px;}
.kpi-trend{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:3px;opacity:.9;}
.kpi-c1{background:linear-gradient(145deg,#5B3DF6,#7C3AED);color:#fff;}
.kpi-c2{background:linear-gradient(145deg,#059669,#02B07A);color:#fff;}
.kpi-c3{background:linear-gradient(145deg,#0052CC,#006BFF);color:#fff;}
.kpi-c4{background:linear-gradient(145deg,#6D28D9,#9333EA);color:#fff;}
.kpi-c5{background:linear-gradient(145deg,#DC2626,#EF4444);color:#fff;}

.grid-3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:18px;margin-bottom:18px;}
.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:18px;}

.priority-legend{display:flex;flex-direction:column;gap:14px;margin-top:18px;}
.plegend-item{display:flex;align-items:center;gap:10px;font-size:13px;}
.pdot{width:10px;height:10px;border-radius:50%;}
.plegend-item .pval{margin-left:auto;font-weight:700;font-family:var(--font-mono);}

.occ-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.occ-item:last-child{border:none;padding-bottom:0;}
.occ-date{
  width:46px;height:46px;border-radius:11px;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border);
}
.occ-date .dd{font-size:15px;font-weight:800;line-height:1;}
.occ-date .mm{font-size:9.5px;color:var(--text-secondary);font-weight:700;letter-spacing:.5px;}
.occ-info .oname{font-size:13.5px;font-weight:600;}
.occ-tag{font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;display:inline-block;margin-top:3px;}
.occ-status-dot{width:8px;height:8px;border-radius:50%;margin-left:auto;flex-shrink:0;}

.todo-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.todo-row:last-child{border:none;}
.checkbox{width:18px;height:18px;border-radius:6px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.checkbox.checked{background:var(--secondary);border-color:var(--secondary);}
.checkbox svg{width:11px;height:11px;color:#fff;display:none;}
.checkbox.checked svg{display:block;}
.todo-title{font-size:13.5px;font-weight:500;flex:1;}
.todo-title.done{text-decoration:line-through;color:var(--text-tertiary);}
.badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.badge-high{background:rgba(239,68,68,0.15);color:#F87171;}
.badge-medium{background:rgba(245,158,11,0.15);color:#FBBF24;}
.badge-low{background:rgba(2,176,122,0.15);color:#34D399;}
.badge-pending{background:rgba(124,58,237,0.15);color:#A78BFA;}
.badge-progress{background:rgba(0,107,255,0.15);color:#60A5FA;}
.badge-completed{background:rgba(2,176,122,0.15);color:#34D399;}
.badge-hold{background:rgba(245,158,11,0.15);color:#FBBF24;}
.todo-date{font-size:11.5px;color:var(--text-tertiary);white-space:nowrap;font-family:var(--font-mono);}

.quick-actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.qa-btn{
  display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;
  background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .2s;font-size:13px;font-weight:600;color:var(--text);
}
.qa-btn:hover{border-color:var(--primary);background:var(--card-hover);transform:translateY(-2px);}
.qa-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qa-icon svg{width:16px;height:16px;color:#fff;}

.status-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:13px;border-bottom:1px solid var(--border);}
.status-row:last-child{border:none;padding-bottom:0;}
.status-live{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--secondary);}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--secondary);position:relative;}
.pulse::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--secondary);animation:pulse 1.6s infinite;}
@keyframes pulse{0%{transform:scale(1);opacity:.7;}100%{transform:scale(2.6);opacity:0;}}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:11px;
  border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;
}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(0,107,255,0.3);}
.btn-primary:hover{background:var(--primary-dim);transform:translateY(-1px);}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
.btn-danger{background:rgba(239,68,68,0.12);color:var(--danger);}
.btn-danger:hover{background:rgba(239,68,68,0.22);}
.btn-sm{padding:7px 12px;font-size:12px;}

@media(max-width:1200px){
  .grid-3{grid-template-columns:1fr 1fr;}
}
/* Toasts */
#toast-wrap{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:10px;}
.toast{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
  padding:13px 18px;border-radius:13px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.3);
  transform:translateX(120%);opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);min-width:260px;
}
.toast.show{transform:translateX(0);opacity:1;}
.toast svg{width:16px;height:16px;color:var(--secondary);flex-shrink:0;}
.toast-error svg{color:var(--danger);}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:500;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.show{display:flex;animation:fadeIn .2s ease;}
.modal-box{
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:22px;
  width:100%;max-width:540px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,0.5);
  animation:modalIn .3s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes modalIn{from{transform:scale(.94) translateY(10px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px;font-weight:700;}
.modal-close{width:32px;height:32px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);}
.modal-close:hover{color:var(--danger);}
.modal-close svg{width:15px;height:15px;}
.modal-body{padding:22px 24px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border);}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
input.finput,select.finput,textarea.finput{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:11px;
  padding:10px 13px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;transition:border-color .2s;
}
input.finput:focus,select.finput:focus,textarea.finput:focus{border-color:var(--primary);}
textarea.finput{resize:vertical;min-height:70px;}

/* Filter tabs */
.tab-row{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);padding:4px;border-radius:12px;width:fit-content;margin-bottom:18px;}
.tab-btn{padding:8px 16px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;border:none;background:none;font-family:inherit;transition:all .2s;}
.tab-btn.active{background:var(--primary);color:#fff;}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.toolbar-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.mobile-card-list{display:none;}
.mc-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
.mc-card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;}
.mc-title{font-size:13.5px;font-weight:700;margin-bottom:4px;word-break:break-word;}
.mc-card-meta{font-size:12px;color:var(--text-secondary);display:flex;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
.mc-card-meta svg{width:12px;height:12px;vertical-align:-2px;}
.mc-card-actions{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border);padding-top:10px;}
.toolbar .flex1{flex:1;}
.select-sm{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--text);font-family:inherit;cursor:pointer;}
.search-sm{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-width:220px;}
.search-sm input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit;}
.search-sm svg{width:14px;height:14px;color:var(--text-tertiary);flex-shrink:0;}

/* Table */
.data-table{width:100%;border-collapse:collapse;}
.data-table th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-tertiary);
  font-weight:700;padding:12px 14px;border-bottom:1px solid var(--border);
}
.data-table td{padding:13px 14px;font-size:13px;border-bottom:1px solid var(--border);}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--card-hover);}
.row-actions{display:flex;gap:6px;}
.mini-btn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--border);cursor:pointer;color:var(--text-secondary);transition:all .15s;}
.mini-btn:hover{color:var(--primary);border-color:var(--primary);}
.mini-btn svg{width:13px;height:13px;}
.mini-btn.danger:hover{color:var(--danger);border-color:var(--danger);}
.pagination{display:flex;align-items:center;justify-content:space-between;padding-top:16px;font-size:12px;color:var(--text-secondary);}
.page-dots{display:flex;gap:6px;}
.page-dot{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);cursor:pointer;font-weight:600;}
.page-dot.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* Kanban */
.kanban-wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.kanban-col{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;min-height:200px;}
.kanban-col.drag-over{border-color:var(--primary);background:rgba(0,107,255,0.05);}
.kcol-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:0 4px;}
.kcol-dot{width:9px;height:9px;border-radius:50%;}
.kcol-title{font-size:13px;font-weight:700;}
.kcol-count{margin-left:auto;font-size:11px;background:var(--bg);padding:2px 8px;border-radius:20px;color:var(--text-secondary);font-weight:700;}
.kcard{
  background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;
  cursor:grab;transition:all .2s;
}
.kcard:hover{border-color:var(--primary);transform:translateY(-2px);}
.kcard.dragging{opacity:.4;}
.kcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.kcard-title{font-size:13px;font-weight:600;line-height:1.35;}
.kcard-desc{font-size:11.5px;color:var(--text-secondary);margin-bottom:10px;line-height:1.4;}
.kcard-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-tertiary);}
.kcard-avatar{width:20px;height:20px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}
.kcard-progress{height:4px;background:var(--border);border-radius:4px;margin-top:10px;overflow:hidden;}
.kcard-progress-fill{height:100%;background:var(--primary);border-radius:4px;}
.add-task-btn{width:100%;padding:10px;border-radius:11px;border:1.5px dashed var(--border);background:none;color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;}
.add-task-btn:hover{border-color:var(--primary);color:var(--primary);}

/* Calendar */
.cal-grid-wrap{width:100%;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--text-tertiary);padding-bottom:8px;text-transform:uppercase;}
.cal-cell{
  background:var(--bg);border:1px solid var(--border);border-radius:12px;min-height:92px;padding:8px;
  cursor:pointer;transition:all .15s;position:relative;
}
.cal-cell:hover{border-color:var(--primary);}
.cal-cell.other-month{opacity:.35;}
.cal-cell.today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary);}
.cal-daynum{font-size:12px;font-weight:700;margin-bottom:5px;}
.cal-event{font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;}
.cal-week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-week-col{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px;min-height:220px;cursor:pointer;transition:all .15s;}
.cal-week-col:hover{border-color:var(--primary);}
.cal-week-col.today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary);}
.cal-week-daylabel{font-size:10.5px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;margin-bottom:8px;text-align:center;}
@media(max-width:900px){ .cal-week-grid{grid-template-columns:repeat(7,minmax(90px,1fr));overflow-x:auto;} }
.cal-agenda{display:none;}
.agenda-day{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.agenda-day:last-child{border:none;}
.agenda-date{width:46px;height:46px;border-radius:11px;background:var(--bg);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.agenda-date .dd{font-size:15px;font-weight:800;line-height:1;}
.agenda-date .mm{font-size:9.5px;color:var(--text-secondary);font-weight:700;}
.agenda-events{flex:1;display:flex;flex-direction:column;gap:8px;}
.agenda-event{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:9px 12px;cursor:pointer;transition:border-color .15s;}
.agenda-event:hover{border-color:var(--primary);}

/* Notifications */
.notif-item{display:flex;gap:12px;padding:14px;border-radius:14px;margin-bottom:8px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .15s;position:relative;}
.notif-item:hover{border-color:var(--primary);}
.notif-item.unread::before{content:'';position:absolute;left:6px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--primary);}
.notif-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.notif-icon svg{width:16px;height:16px;color:#fff;}
.notif-title{font-size:13px;font-weight:700;margin-bottom:2px;}
.notif-msg{font-size:12px;color:var(--text-secondary);line-height:1.4;}
.notif-time{font-size:10.5px;color:var(--text-tertiary);margin-top:5px;}
.notif-dropdown{
  position:absolute;top:56px;right:0;width:380px;max-height:480px;overflow-y:auto;
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);padding:14px;z-index:300;display:none;
}
.notif-dropdown.show{display:block;animation:modalIn .2s ease;}
.dropdown-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px;}
.dropdown-head h4{font-size:14px;font-weight:700;}

/* Settings tabs */
.settings-layout{display:grid;grid-template-columns:220px 1fr;gap:20px;}
.settings-nav{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:10px;height:fit-content;}
.settings-nav-item{padding:11px 14px;border-radius:11px;font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;transition:all .15s;margin-bottom:2px;}
.settings-nav-item:hover{background:var(--card-hover);color:var(--text);}
.settings-nav-item.active{background:var(--primary);color:#fff;}
.settings-panel{display:none;}
.settings-panel.active{display:block;animation:fadeIn .3s ease;}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;}
.status-pill.on{background:rgba(2,176,122,0.14);color:var(--secondary);}
.status-pill.off{background:rgba(239,68,68,0.14);color:var(--danger);}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-tertiary);}
.empty-state svg{width:44px;height:44px;margin-bottom:12px;opacity:.5;}
.empty-state p{font-size:13.5px;}

.chart-wrap{position:relative;height:220px;}
.chart-wrap.sm{height:170px;}

/* ============ AUTH SCREEN ============ */
.auth-wrap{
  min-height:100vh;width: min(100%, 650px) !important;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(circle at 20% 20%,rgba(0,107,255,0.15),transparent 45%),radial-gradient(circle at 80% 80%,rgba(124,58,237,0.15),transparent 45%),var(--bg);
}
/* Only ever rendered as a sibling of .auth-wrap inside renderAuthScreen() — renderShell() (the
   post-login app) replaces #app's innerHTML entirely with different markup that never includes
   this element, so the background image can't leak into the app the way it did on .app itself. */
.auth-image-panel{
  flex:1;min-height:100vh;
  background:url("/19807.jpg") center center / cover no-repeat;
}
@media(max-width:900px){ .auth-image-panel{display:none;} }
.auth-card{
  width:100%;max-width:490px;background:var(--card);border:1px solid var(--border);border-radius:24px;
  padding:36px 32px;box-shadow:0 30px 80px rgba(0,0,0,0.35);
}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.auth-title{font-size:20px;font-weight:800;margin-bottom:4px;}
.auth-sub{font-size:13px;color:var(--text-secondary);margin-bottom:26px;}
.auth-tabs{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:22px;}
.auth-tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:13px;font-weight:700;color:var(--text-secondary);cursor:pointer;transition:all .2s;}
.auth-tab.active{background:var(--primary);color:#fff;}
.auth-error{background:rgba(239,68,68,0.12);color:#F87171;font-size:12.5px;padding:10px 14px;border-radius:10px;margin-bottom:16px;display:none;}
.auth-error.show{display:block;}
.auth-footer{text-align:center;font-size:12px;color:var(--text-tertiary);margin-top:18px;}
.auth-footer a{color:var(--primary);cursor:pointer;font-weight:600;}
.auth-loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--text-secondary);font-size:14px;gap:10px;}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--primary);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Mobile-only controls (hidden by default on desktop) */
.hamburger-btn,.mobile-search-btn{display:none;}
.hamburger-btn{
  width:40px;height:40px;border-radius:12px;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;flex-shrink:0;
}
.hamburger-btn svg{width:18px;height:18px;}
.sidebar-backdrop{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:150;
  opacity:0;transition:opacity .25s ease;
}
.sidebar-backdrop.show{display:block;opacity:1;}
.mobile-search-bar{display:none;padding:0 20px 14px;}
.mobile-search-bar.show{display:block;animation:fadeIn .2s ease;}

/* ---------------- Tablet / small laptop ---------------- */
@media(max-width:1200px){
  .grid-3{grid-template-columns:1fr 1fr;}
  .grid-3 > .card:nth-child(3){grid-column:1 / -1;}
}

/* ---------------- Tablet / mobile ---------------- */
@media(max-width:900px){
  .sidebar{position:fixed;left:-280px;top:0;height:100vh;z-index:200;box-shadow:0 0 40px rgba(0,0,0,0.4);transition:left .3s ease;}
  .sidebar.mobile-open{left:0;}
  .sidebar.collapsed{width:264px;}
  .collapse-toggle{display:none;}
  .hamburger-btn{display:flex;}
  .search-box{display:none;}
  .mobile-search-btn{display:flex;}
  .grid-3,.grid-2{grid-template-columns:1fr;}
  .grid-3 > .card:nth-child(3){grid-column:auto;}
  .topbar{padding:0 14px;gap:10px;}
  .theme-switch{display:none;}
  .profile-info{display:none;}
  .profile-menu{padding:6px;border:none;background:none;}
  .page-content{padding:18px 16px 32px;}
  .hero-title{font-size:21px;}
  .hero-row{align-items:center;}
  .date-pill{min-width:auto;padding:10px 14px;}
  .date-pill .dbig{font-size:12.5px;}
  .kanban-wrap{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:82%;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;}
  .kanban-col{scroll-snap-align:start;}
  .settings-layout{grid-template-columns:1fr;}
  .settings-nav{display:flex;overflow-x:auto;gap:6px;padding:8px;}
  .settings-nav-item{white-space:nowrap;margin-bottom:0;}
  .data-table{display:block;overflow-x:auto;white-space:nowrap;}
  .toolbar{gap:8px;}
  .toolbar-group{width:100%;}
  .toolbar .search-sm{min-width:0;flex:1;}
  .quick-actions-grid{grid-template-columns:1fr 1fr;}
}

/* ---------------- Phones: swap dense tables for card lists ---------------- */
@media(max-width:640px){
  .table-scroll{display:none;}
  .mobile-card-list{display:block;}
  .toolbar{flex-direction:column;align-items:stretch;}
  .toolbar-group{width:100%;}
  .toolbar-group .select-sm{flex:1;}
  .toolbar .search-sm{width:100%;}
  .toolbar .btn .btn-label{display:none;}
  .toolbar .btn{width:44px;justify-content:center;padding:10px;}
  .tab-row{width:100%;}
  .tab-row .tab-btn{flex:1;}
  .cal-grid-wrap{display:none;}
  .cal-agenda{display:block;}
  .notif-dropdown{
    position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;max-height:78vh;
    border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,0.45);
  }
  .notif-dropdown.show{animation:sheetUp .25s ease;}
}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}

/* ---------------- Small phones ---------------- */
@media(max-width:480px){
  .quick-actions-grid{grid-template-columns:1fr;}
  .hero-row{flex-direction:column;align-items:flex-start;}
  .date-pill{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;}
  .modal-box{max-height:92vh;}
  .form-row{grid-template-columns:1fr;}
  .cal-cell{min-height:64px;padding:5px;}
  .cal-event{font-size:8.5px;}
  .toolbar{flex-wrap:wrap;}
  .kanban-wrap{grid-auto-columns:88%;}
}

// Defensive shape-check: only accept remote rows that actually look like our records.
// This is what stops a mismatched Supabase table (different column names) from silently
// wiping the TODO Manager / Occasions screen out with blank data.
function normalizeTodoRow(r){
  if(!r || typeof r!=='object' || !r.title) return null;
  return {
    id:r.id, title:r.title, desc:r.desc||r.description||'',
    assignee:r.assignee||'Unassigned', deadline:r.deadline||r.due_date||'2026-07-10',
    priority:['High','Medium','Low'].includes(r.priority)?r.priority:'Medium',
    status:['Pending','InProgress','Completed','OnHold'].includes(r.status)?r.status:'Pending',
    progress: typeof r.progress==='number'?r.progress:0,
    tags:Array.isArray(r.tags)?r.tags:[],
  };
}
// Reads a value off a row trying several possible header spellings (case/space/underscore insensitive).
// This is what lets the sheet's real 9 columns (whatever their exact header text is) map in without
// needing an exact-match config — as long as the header contains the expected word, it's picked up.
function pick(row, ...candidates){
  const keys = Object.keys(row||{});
  for(const cand of candidates){
    const target = cand.toLowerCase().replace(/[\s_-]/g,'');
    const hit = keys.find(k=>k.toLowerCase().replace(/[\s_-]/g,'')===target);
    if(hit!==undefined && row[hit]!==undefined && row[hit]!=='') return row[hit];
  }
  return undefined;
}
function normalizeOccRow(r) {
  if (!r || typeof r !== 'object') return null;

  const name = pick(r, 'name', 'occasionname', 'occasion', 'title');
  const date = pick(r, 'date');

  if (!name || !date) return null;

  // Normalize status
  let status = String(pick(r, 'status') || 'Upcoming').trim().toLowerCase();

  switch (status) {
    case 'completed':
      status = 'Completed';
      break;

    case 'upcoming':
    default:
      status = 'Upcoming';
      break;
  }

  return {
    id: pick(r, 'id') || undefined,

    day:
      pick(r, 'day') ||
      new Date(date + 'T00:00:00').toLocaleDateString('en', {
        weekday: 'long'
      }),

    date,
    name,

    category: pick(r, 'category') || 'Custom',

    status,

    reminder:
      pick(r, 'remindertime', 'reminder') ||
      '09:00 AM',

    // ✅ Support Apps Script field
    desc:
      pick(r, 'description', 'desc', 'notes') || '',

    attachment:
      pick(r, 'attachment') || ''
  };
}

// Best-effort read: tries Supabase table, falls back to whatever is already in `fallbackArr`.
async function sbLoad(table, fallbackArr, normalizer){
  if(!sb) { backendStatus.supabase='off'; return fallbackArr; }
  try{
    const { data, error } = await sb.from(table).select('*').order('id',{ascending:true});
    if(error) throw error;
    if(!data || !data.length){ backendStatus.supabase='on'; return fallbackArr; }
    const normalized = normalizer ? data.map(normalizer).filter(Boolean) : data;
    if(normalizer && normalized.length===0){
      console.warn(`Supabase table "${table}" has rows but none match the expected columns — keeping demo data. Check your table schema.`);
      backendStatus.supabase='partial';
      return fallbackArr;
    }
    backendStatus.supabase='on';
    return normalized;
  }catch(e){
    console.warn(`Supabase table "${table}" not available yet, using demo data:`, e.message||e);
    backendStatus.supabase='partial';
    return fallbackArr;
  }
}
// Best-effort write: insert / update / delete. Never throws — logs and lets the UI keep working on local state.
async function sbInsert(table,row){ if(!sb) return null; try{ const {data,error}=await sb.from(table).insert(row).select(); if(error) throw error; return data?data[0]:null; }catch(e){ console.warn('Supabase insert failed:',e.message||e); return null; } }
async function sbUpdate(table,id,row){ if(!sb) return null; try{ const {error}=await sb.from(table).update(row).eq('id',id); if(error) throw error; return true; }catch(e){ console.warn('Supabase update failed:',e.message||e); return null; } }
async function sbDelete(table,id){ if(!sb) return null; try{ const {error}=await sb.from(table).delete().eq('id',id); if(error) throw error; return true; }catch(e){ console.warn('Supabase delete failed:',e.message||e); return null; } }

// Google Apps Script bridge (email reminders). Uses text/plain to dodge CORS preflight on most Apps Script deployments.
async function callAppsScript(action, payload){
  try{

      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action, ...payload}),
    });

  }catch(e){

    backendStatus.sheets='off';

}

// Occasions <-> Google Sheet bridge (same Apps Script deployment). GET to read the sheet's rows.
// Handles two common Apps Script response shapes:
//  (a) array of objects with column names as keys — used as-is
//  (b) array of arrays where row 0 is the header row (typical of sheet.getDataRange().getValues())
//      — converted into objects using those headers before normalizing.
// Never throws — Occasions keeps working on demo data if the sheet is unreachable, and logs the
// raw response to the console so a bad deployment/access setting is easy to spot.
let lastOccSheetError = '';
async function fetchOccasionsFromSheet(){
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=list', { method:'GET' });
    const rawText = await res.text();
    let json;
    try{ json = JSON.parse(rawText); }
    catch(parseErr){
      lastOccSheetError = 'Response was not JSON (got HTML/text) — check the Apps Script deployment is set to "Anyone" access. First 200 chars: ' + rawText.slice(0,200);
      console.warn('Occasions sheet returned non-JSON:', rawText.slice(0,500));
      backendStatus.occSheet = 'off';
      return null;
    }
    let rows = Array.isArray(json) ? json : (json.data || json.occasions || json.rows || []);
    if(rows.length && Array.isArray(rows[0])){
      // Array-of-arrays shape: treat the first row as headers.
      const headers = rows[0].map(h=>String(h||'').trim());
      rows = rows.slice(1).map(arr=>{
        const obj = {};
        headers.forEach((h,i)=>{ obj[h] = arr[i]; });
        return obj;
      });
    }
    const normalized = rows.map(normalizeOccRow).filter(Boolean);
    if(rows.length && normalized.length===0){
      lastOccSheetError = `Got ${rows.length} row(s) back but none matched expected columns (need at least a date + name/occasion column). Raw sample: ` + JSON.stringify(rows[0]).slice(0,200);
      console.warn(lastOccSheetError);
      backendStatus.occSheet = 'partial';
      return null;
    }
    backendStatus.occSheet = normalized.length ? 'on' : 'partial';
    lastOccSheetError = '';
    return normalized;
  }catch(e){
    lastOccSheetError = e.message || String(e);
    console.warn('Occasions sheet fetch failed:', e.message||e);
    backendStatus.occSheet = 'off';
    return null;
  }
}
async function pushOccasionToSheet(action, occasion = {}) {

    const body = {
        action,
        id: occasion.id || "",
        date: occasion.date || "",
        day: occasion.day || "",
        name: occasion.name || "",
        category: occasion.category || "",
        status: occasion.status || "upcoming",
        notes: occasion.desc || occasion.notes || "",
        reminderTime: occasion.reminder || "09:00 AM",
        attachment: occasion.attachment || ""
    };

    const res = await fetch(`${APPS_SCRIPT_URL}`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
    });

    const json = await res.json();

    if (json.status !== "success") {
        throw new Error(json.message || "Failed to sync with Google Sheet");
    }

    return json;
}

async function handleAuthSubmit(){
  if(authBusy) return;
  if(!sb){ renderAuthScreen('Supabase client failed to load. Check your network / SDK connection.'); return; }
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if(!email || !password){ document.getElementById('auth-error').textContent='Please enter both email and password.'; document.getElementById('auth-error').classList.add('show'); return; }
  authBusy = true;
  const btn = document.getElementById('auth-submit-btn');
  btn.disabled = true; btn.style.opacity='.7';
  try{
    if(authMode==='login'){
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      currentSession = data.session;
      onAuthSuccess();
    }else{
      const name = document.getElementById('auth-name').value.trim() || email.split('@')[0];
      const role = FORCE_ADMIN_EMAILS.includes(email.toLowerCase()) ? 'Administrator' : document.getElementById('auth-role').value;
      const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name:name, role } } });
      if(error) throw error;
      sbInsert('profiles', { full_name:name, email, role, status:'Active' }).catch(()=>{});
      if(data.session){
        currentSession = data.session;
        onAuthSuccess();
      }else{
        renderAuthScreen();
        toast('Account created — check your email to confirm, then log in.');
        setAuthMode('login');
      }
    }
  }catch(e){
    renderAuthScreen(e.message || 'Authentication failed. Please try again.');
  }finally{
    authBusy = false;
  }
}

    const role = forcedAdmin ? 'Administrator' : (meta.role || 'Viewer');
    state.currentUser = {
      name: meta.full_name || u.email.split('@')[0],
      role,
      initials: (meta.full_name||u.email).split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(),
      email: u.email,
    };
    // Self-heal: if this account should be admin but its stored metadata/role says otherwise
    // (e.g. it was created before role handling existed), quietly correct it going forward.
    if(forcedAdmin && meta.role !== 'Administrator' && sb){
      sb.auth.updateUser({ data:{ ...meta, role:'Administrator' } }).catch(()=>{});
      sb.from('profiles').update({ role:'Administrator' }).eq('email', u.email).then(()=>{}).catch(()=>{});
    }
  }
  bootApp();
}

function shadeColor(hex, percent){
  const n = parseInt(hex.slice(1),16);
  const amt = Math.round(2.55*percent);
  const r = Math.max(0,Math.min(255,(n>>16)+amt));
  const g = Math.max(0,Math.min(255,((n>>8)&0xff)+amt));
  const b = Math.max(0,Math.min(255,(n&0xff)+amt));
  return '#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
}

function deleteOcc(id){
  if(!canEditContent()){ toast('Viewers cannot delete occasions','error'); return; }
  if(confirm('Delete this occasion? This cannot be undone.')){
    const o = occasions.find(x=>x.id===id);
    occasions = occasions.filter(o=>o.id!==id);
    renderPage(); toast('Occasion deleted');
    if (o) pushOccasionToSheet('deleteEvent', o);
    logActivity(`Deleted occasion "${o?o.name:id}"`, 'Occasion Edited');
  }
}
function duplicateOcc(id){
  if(!canEditContent()){ toast('Viewers cannot duplicate occasions','error'); return; }
  const o = occasions.find(x=>x.id===id);
  if(o){
    const copy = {...o, id:idCounter.occ++, name:o.name+' (Copy)'};
    occasions.push(copy); renderPage(); toast('Occasion duplicated');
    pushOccasionToSheet('addEvent', copy);
  }
}
function openOccModal(id){
  const editing = id ? occasions.find(o=>o.id===id) : null;
  const readOnly = editing && !canEditContent();
  const m = editing || {date:'',name:'',category:'Festival',reminder:'09:00 AM',desc:'',status:'Upcoming'};
  const dis = readOnly ? 'disabled' : '';
  showModal(`

      </div>

      <div class="form-group"><label>Category</label>
        <select class="finput" id="f-occ-category" ${dis}>
          ${['Festival','Government Holiday','Special Occasion','Birthday','Anniversary','Meeting','Maintenance','Company Event','Custom'].map(c=>`<option ${m.category===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>Description</label><textarea class="finput" id="f-occ-desc" ${dis}>${m.desc}</textarea></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">${readOnly?'Close':'Cancel'}</button>${readOnly?'':`<button class="btn btn-primary" onclick="saveOcc(${editing?editing.id:'null'})">${icon('check')}Save Occasion</button>`}</div>
  `);
}
function saveOcc(id){
  if(!canEditContent() && id){ toast('Viewers cannot edit occasions','error'); return; }
  const date=document.getElementById('f-occ-date').value;
  const name=document.getElementById('f-occ-name').value.trim();
  if(!date || !name){ toast('Please fill in date and name','error'); return; }
  const data = {
    date, name,
    category:document.getElementById('f-occ-category').value,
    reminder:document.getElementById('f-occ-reminder').value,
    desc:document.getElementById('f-occ-desc').value,
    status: new Date(date) >= new Date('2026-07-06') ? 'Upcoming' : 'Completed',
  };
  if(id){
    Object.assign(occasions.find(o=>o.id===id), data); toast('Occasion updated');
    pushOccasionToSheet('updateEvent', { id, ...data });
    logActivity(`Edited occasion "${name}"`, 'Occasion Edited');
  } else{
    const local = {id:idCounter.occ++, ...data};
    occasions.push(local); toast('Occasion added');
    pushOccasionToSheet('addEvent', local);
    logActivity(`Added occasion "${name}"`, 'Occasion Edited');
  }
  closeModal(); renderPage();
}

let dragTodoId = null;
function handleDragStart(e,id){ dragTodoId=id; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function handleDrop(e,colId){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if(!canEditContent()){ toast('Viewers cannot move tasks','error'); return; }
  const t = todos.find(x=>x.id===dragTodoId);
  if(t){
    t.status=colId; if(colId==='Completed'){t.progress=100;}
    renderPage(); toast('Task moved to '+TODO_COLS.find(c=>c.id===colId).label);
    sbUpdate('todos', t.id, {status:t.status, progress:t.progress});
    logActivity(`Moved TODO "${t.title}" to ${TODO_COLS.find(c=>c.id===colId).label}`, 'TODO Added');
  }
}

function deleteTodo(id){
  if(!canEditContent()){ toast('Viewers cannot delete TODOs','error'); return; }
  if(confirm('Delete this TODO? This cannot be undone.')){
    const t = todos.find(x=>x.id===id);
    todos = todos.filter(t=>t.id!==id); renderPage(); toast('TODO deleted');
    sbDelete('todos', id);
    logActivity(`Deleted TODO "${t?t.title:id}"`, 'TODO Deleted');
  }
}
function openTodoModal(id,presetStatus){

  const dis = readOnly ? 'disabled' : '';

      <div class="form-row">
        <div class="form-group"><label>Assigned To</label>
          <select class="finput" id="f-todo-assignee" ${dis}>${['IT Team','Dev Team','QA Team','Design Team'].map(a=>`<option ${m.assignee===a?'selected':''}>${a}</option>`).join('')}</select>
        </div>

          <select class="finput" id="f-todo-priority" ${dis}>${['High','Medium','Low'].map(p=>`<option ${m.priority===p?'selected':''}>${p}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label>Status</label>
          <select class="finput" id="f-todo-status" ${dis}>${TODO_COLS.map(c=>`<option value="${c.id}" ${m.status===c.id?'selected':''}>${c.label}</option>`).join('')}</select>
        </div>
      </div>
    </div>

  `);

function saveTodo(id){
  if(!canEditContent() && id){ toast('Viewers cannot edit TODOs','error'); return; }
  const title = document.getElementById('f-todo-title').value.trim();
  if(!title){ toast('Please enter a title','error'); return; }
  const status = document.getElementById('f-todo-status').value;
  const data = {
    title, desc:document.getElementById('f-todo-desc').value,
    assignee:document.getElementById('f-todo-assignee').value,
    deadline:document.getElementById('f-todo-deadline').value,
    priority:document.getElementById('f-todo-priority').value,
    status, progress: status==='Completed'?100:(status==='Pending'?0:50),
  };
  if(id){
    Object.assign(todos.find(t=>t.id===id), data); toast('TODO updated');
    sbUpdate('todos', id, data);
    logActivity(`Edited TODO "${title}"`, 'TODO Added');
  } else{
    const local = {id:idCounter.todo++, tags:[], ...data};
    todos.push(local); toast('TODO added');
    sbInsert('todos', data).then(r=>{ if(r && r.id){ local.id = r.id; } });
    logActivity(`Added TODO "${title}"`, 'TODO Added');
  }
  closeModal(); renderPage();
}

/* ============ CALENDAR PAGE ============ */
let calMonth = 6, calYear = 2026; // July 2026 (0-indexed month)
let calView = 'month';
let calCursor = '2026-07-06'; // reference date for week/day views
const TODAY_STR = '2026-07-06';
function allCalEvents(){
  const evs=[];
  occasions.forEach(o=>evs.push({date:o.date,label:o.name,color:catColor(o.category),type:'Occasion',refId:o.id,kind:'occasion'}));
  todos.forEach(t=>evs.push({date:t.deadline,label:t.title,color:'#EF4444',type:'TODO Deadline',refId:t.id,kind:'todo'}));
  return evs;
}
function openCalEvent(kind,id){
  closeModal();
  if(kind==='occasion'){ openOccModal(id); } else { openTodoModal(id); }
}
function setCalView(v){ calView=v; renderPage(); }
function agendaBlockHtml(evList){
  const byDate = {};
  evList.sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(e=>{ (byDate[e.date]=byDate[e.date]||[]).push(e); });
  if(Object.keys(byDate).length===0) return `<div class="empty-state">${icon('calendar')}<p>No events found.</p></div>`;
  return Object.entries(byDate).map(([date,evs])=>{
    const d = fmtDate(date);
    return `<div class="agenda-day">
      <div class="agenda-date"><div class="dd">${d.dd}</div><div class="mm">${d.mm}</div></div>
      <div class="agenda-events">
        ${evs.map(e=>`<div class="agenda-event" onclick="openCalEvent('${e.kind}',${e.refId})">
          <span class="pdot" style="background:${e.color}"></span>
          <div><div class="mc-title" style="margin-bottom:2px;">${e.label}</div><span class="badge" style="background:${e.color}22;color:${e.color}">${e.type}</span></div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}
function renderCalToolbar(monthName){
  return `
    <div class="toolbar">
      <div class="toolbar-group">
        <div class="mini-btn" onclick="shiftCal(-1)">${icon('chevronL')}</div>
        <div style="font-weight:700;font-size:15px;white-space:nowrap;">${monthName}</div>
        <div class="mini-btn" onclick="shiftCal(1)">${icon('chevronR')}</div>
        <button class="btn btn-ghost btn-sm" onclick="goToToday()">Today</button>
      </div>
      <div class="flex1"></div>
      <div class="tab-row" style="margin-bottom:0;">
        <button class="tab-btn${calView==='month'?' active':''}" onclick="setCalView('month')">Month</button>
        <button class="tab-btn${calView==='week'?' active':''}" onclick="setCalView('week')">Week</button>
        <button class="tab-btn${calView==='day'?' active':''}" onclick="setCalView('day')">Day</button>
        <button class="tab-btn${calView==='agenda'?' active':''}" onclick="setCalView('agenda')">Agenda</button>
      </div>
    </div>`;
}
function shiftCal(dir){
  if(calView==='month'){
    calMonth += dir; if(calMonth<0){calMonth=11;calYear--;} if(calMonth>11){calMonth=0;calYear++;}
  } else if(calView==='week'){
    const d = new Date(calCursor+'T00:00:00'); d.setDate(d.getDate()+dir*7); calCursor = d.toISOString().slice(0,10);
  } else if(calView==='day'){
    const d = new Date(calCursor+'T00:00:00'); d.setDate(d.getDate()+dir); calCursor = d.toISOString().slice(0,10);
  } else {
    calMonth += dir; if(calMonth<0){calMonth=11;calYear--;} if(calMonth>11){calMonth=0;calYear++;}
  }
  renderPage();
}
function goToToday(){ calCursor = TODAY_STR; calMonth = 6; calYear = 2026; renderPage(); }
function renderCalendar(){
  const events = allCalEvents();
  if(calView==='week') return renderCalWeek(events);
  if(calView==='day') return renderCalDay(events);
  if(calView==='agenda') return renderCalAgenda(events);
  return renderCalMonth(events);
}
function renderCalMonth(events){
  const firstDay = new Date(calYear, calMonth, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();
  const monthName = firstDay.toLocaleString('en',{month:'long'});
  let cells = '';
  for(let i=startOffset-1;i>=0;i--){ cells += `<div class="cal-cell other-month"><div class="cal-daynum">${daysInPrevMonth-i}</div></div>`; }
  const monthEvents = [];
  for(let d=1;d<=daysInMonth;d++){
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEvents = events.filter(e=>e.date===dateStr);
    dayEvents.forEach(e=>monthEvents.push(e));
    const isToday = dateStr===TODAY_STR;
    cells += `<div class="cal-cell${isToday?' today':''}" onclick="openDayModal('${dateStr}')">
      <div class="cal-daynum">${d}</div>
      ${dayEvents.slice(0,2).map(e=>`<div class="cal-event" style="background:${e.color}">${e.label}</div>`).join('')}
      ${dayEvents.length>2?`<div style="font-size:9.5px;color:var(--text-tertiary);">+${dayEvents.length-2} more</div>`:''}
    </div>`;
  }
  const totalCells = startOffset + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let i=1;i<=trailing;i++){ cells += `<div class="cal-cell other-month"><div class="cal-daynum">${i}</div></div>`; }
  const agendaHtml = agendaBlockHtml(monthEvents);
  return `
    <div class="breadcrumb"><span>Home</span> ${icon('chevronR')} <span class="cur">Calendar</span></div>
    <div class="hero-row"><div class="hero-title">Calendar</div><button class="btn btn-primary" onclick="openOccModal()">${icon('plus')}Add Event</button></div>
    <div class="card">
      ${renderCalToolbar(monthName+' '+calYear)}
      <div class="cal-grid-wrap">
        <div class="cal-grid">
          ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
          ${cells}
        </div>
      </div>
      <div class="cal-agenda">${agendaHtml}</div>
    </div>
  `;
}
function renderCalWeek(events){
  const cursor = new Date(calCursor+'T00:00:00');
  const startOfWeek = new Date(cursor); startOfWeek.setDate(cursor.getDate()-cursor.getDay());
  const days = [];
  for(let i=0;i<7;i++){ const d=new Date(startOfWeek); d.setDate(startOfWeek.getDate()+i); days.push(d); }
  const label = `${days[0].toLocaleString('en',{month:'short',day:'numeric'})} – ${days[6].toLocaleString('en',{month:'short',day:'numeric'})}, ${days[0].getFullYear()}`;
  const weekEvents = [];
  const cols = days.map(d=>{
    const dateStr = d.toISOString().slice(0,10);
    const dayEvents = events.filter(e=>e.date===dateStr);
    dayEvents.forEach(e=>weekEvents.push(e));
    const isToday = dateStr===TODAY_STR;
    return `<div class="cal-week-col${isToday?' today':''}" onclick="openDayModal('${dateStr}')">
      <div class="cal-week-daylabel">${d.toLocaleString('en',{weekday:'short'})}<br><span style="font-size:15px;font-weight:800;color:var(--text);">${d.getDate()}</span></div>
      ${dayEvents.map(e=>`<div class="cal-event" style="background:${e.color}">${e.label}</div>`).join('')}
    </div>`;
  }).join('');
  return `
    <div class="breadcrumb"><span>Home</span> ${icon('chevronR')} <span class="cur">Calendar</span></div>
    <div class="hero-row"><div class="hero-title">Calendar</div><button class="btn btn-primary" onclick="openOccModal()">${icon('plus')}Add Event</button></div>
    <div class="card">
      ${renderCalToolbar(label)}
      <div class="cal-week-grid">${cols}</div>
    </div>
  `;
}
function renderCalDay(events){
  const d = new Date(calCursor+'T00:00:00');
  const dateStr = calCursor;
  const dayEvents = events.filter(e=>e.date===dateStr);
  const label = d.toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  return `
    <div class="breadcrumb"><span>Home</span> ${icon('chevronR')} <span class="cur">Calendar</span></div>
    <div class="hero-row"><div class="hero-title">Calendar</div><button class="btn btn-primary" onclick="openOccModal()">${icon('plus')}Add Event</button></div>
    <div class="card">
      ${renderCalToolbar(label)}
      ${dayEvents.length===0?`<div class="empty-state">${icon('calendar')}<p>No events on this day.</p></div>`:`
      <div class="agenda-day" style="border:none;">
        <div class="agenda-events" style="width:100%;">
          ${dayEvents.map(e=>`<div class="agenda-event" onclick="openCalEvent('${e.kind}',${e.refId})">
            <span class="pdot" style="background:${e.color}"></span>
            <div><div class="mc-title" style="margin-bottom:2px;">${e.label}</div><span class="badge" style="background:${e.color}22;color:${e.color}">${e.type}</span></div>
          </div>`).join('')}
        </div>
      </div>`}
    </div>
  `;
}
function renderCalAgenda(events){
  const upcoming = events.filter(e=>new Date(e.date) >= new Date(TODAY_STR)).sort((a,b)=>new Date(a.date)-new Date(b.date));
  return `
    <div class="breadcrumb"><span>Home</span> ${icon('chevronR')} <span class="cur">Calendar</span></div>
    <div class="hero-row"><div class="hero-title">Calendar</div><button class="btn btn-primary" onclick="openOccModal()">${icon('plus')}Add Event</button></div>
    <div class="card">
      ${renderCalToolbar('Upcoming Agenda')}
      ${agendaBlockHtml(upcoming)}
    </div>
  `;
}
function openDayModal(dateStr){
  const events = allCalEvents().filter(e=>e.date===dateStr);
  showModal(`
    <div class="modal-head"><h3>${new Date(dateStr+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'})}</h3><div class="modal-close" onclick="closeModal()">${icon('x')}</div></div>

}

async function handleSelfPasswordChange(){
  if(!isAdmin()){ toast('Only Administrators can change passwords directly','error'); return; }
  const p1 = document.getElementById('f-sec-newpass').value;
  const p2 = document.getElementById('f-sec-confirmpass').value;
  if(!p1 || p1.length<6){ toast('Password must be at least 6 characters','error'); return; }
  if(p1!==p2){ toast('Passwords do not match','error'); return; }
  if(!sb){ toast('Supabase not connected','error'); return; }
  try{
    const { error } = await sb.auth.updateUser({ password:p1 });
    if(error) throw error;
    logActivity('Changed own password', 'Login');
    toast('Password updated successfully');
    renderPage();
  }catch(e){ toast(e.message||'Could not update password','error'); }
}
async function handleSelfRequestReset(){
  if(!sb || !currentSession?.user?.email){ toast('Not signed in','error'); return; }
  try{
    const { error } = await sb.auth.resetPasswordForEmail(currentSession.user.email);
    if(error) throw error;
    toast('Reset link sent to '+currentSession.user.email);
  }catch(e){ toast(e.message||'Could not send reset email','error'); }
}
async function adminResetPassword(email){
  if(!canManageUsers()){ toast('Only Administrators can reset passwords','error'); return; }
  if(!confirm(`Send a password reset link to ${email}?`)) return;
  if(!sb){ toast('Supabase not connected','error'); return; }
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email);
    if(error) throw error;
    logActivity(`Sent password reset link to ${email}`, 'Login');
    toast('Password reset link sent to '+email);
  }catch(e){ toast(e.message||'Could not send reset email','error'); }
}
function deleteUser(id){
  if(!canManageUsers()){ toast('Only Administrators can remove users','error'); return; }
  if(confirm('Remove this user?')){
    const u = users.find(x=>x.id===id);
    users=users.filter(u=>u.id!==id);
    if(u) sbDelete('profiles', id);
    logActivity(`Removed user "${u?u.name:id}"`, 'Login');
    renderPage(); toast('User removed');
  }
}
function openUserModal(id){
  if(!canManageUsers()){ toast('Only Administrators can manage users','error'); return; }
  const editing = id ? users.find(u=>u.id===id) : null;
  const m = editing || {name:'',email:'',role:'Viewer',status:'Active'};
  showModal(`
    <div class="modal-head"><h3>${editing?'Edit User':'Invite User'}</h3><div class="modal-close" onclick="closeModal()">${icon('x')}</div></div>
    <div class="modal-body">
      <div class="form-group"><label>Full Name</label><input class="finput" id="f-user-name" value="${m.name}"></div>
      <div class="form-group"><label>Email</label><input class="finput" id="f-user-email" value="${m.email}" ${editing?'disabled':''}></div>
      <div class="form-row">
        <div class="form-group"><label>Role</label><select class="finput" id="f-user-role">${['Administrator','Editor','Viewer'].map(r=>`<option ${m.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
        <div class="form-group"><label>Status</label><select class="finput" id="f-user-status">${['Active','Inactive'].map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      </div>
      ${!editing?`<p style="font-size:11.5px;color:var(--text-tertiary);">This creates a profile record only — the person still needs to sign up themselves with this email to get login access, or use "Send password reset" once they have an account.</p>`:''}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveUser(${editing?editing.id:'null'})">${icon('check')}Save</button></div>
  `);
}
function saveUser(id){
  if(!canManageUsers()){ toast('Only Administrators can manage users','error'); return; }
  const name=document.getElementById('f-user-name').value.trim();
  const email=document.getElementById('f-user-email').value.trim();
  if(!name||!email){ toast('Name and email are required','error'); return; }
  const role=document.getElementById('f-user-role').value, status=document.getElementById('f-user-status').value;
  if(id){
    Object.assign(users.find(u=>u.id===id),{name,role,status});
    sbUpdate('profiles', id, {full_name:name, role, status});
    logActivity(`Updated user "${name}"`, 'Login');
    toast('User updated');
  }else{
    const local={id:idCounter.user++,name,email,role,status,online:false};
    users.push(local);
    sbInsert('profiles', {full_name:name, email, role, status}).then(r=>{ if(r && r.id){ local.id=r.id; } });
    logActivity(`Added user "${name}"`, 'Login');
    toast('User profile created');
  }
  closeModal(); renderPage();
}

          <div class="plegend-item"><span class="pdot" style="background:#F59E0B"></span>Medium <span class="pval">${todos.filter(t=>t.priority==='Medium').length}</span></div>

        <div class="section-title">Upcoming Occasions <button class="link-btn" onclick="navigateTo('occasions')">View All</button></div>

            <div class="occ-info"><div class="oname">${o.name}</div><span class="occ-tag" style="background:${catColor(o.category)}22;color:${catColor(o.category)}">${o.category}</span></div>
            <div class="occ-status-dot" style="background:${catColor(o.category)}"></div>

    </div>

    <div class="grid-3">
      <div class="card">
        <div class="section-title">Recent TODOs <button class="link-btn" onclick="navigateTo('todos')">View All</button></div>
        ${recentTodos.map(t=>`
          <div class="todo-row">
            <div class="checkbox${t.status==='Completed'?' checked':''}" onclick="quickToggleTodo(${t.id})">${icon('check')}</div>
            <div class="todo-title${t.status==='Completed'?' done':''}">${t.title}</div>
            <span class="badge ${badgeClass(t.priority)}">${t.priority}</span>
            <span class="todo-date">${t.deadline}</span>
            <span class="badge ${badgeClass(t.status)}">${statusLabel(t.status)}</span>
          </div>`).join('')}
      </div>
      <div class="card">
        <div class="section-title">Quick Actions</div>
        <div class="quick-actions-grid">
          <div class="qa-btn" onclick="openTodoModal()"><div class="qa-icon" style="background:var(--primary)">${icon('plus')}</div>Add TODO</div>
          <div class="qa-btn" onclick="openOccModal()"><div class="qa-icon" style="background:var(--secondary)">${icon('gift')}</div>Add Occasion</div>
          <div class="qa-btn" onclick="navigateTo('calendar')"><div class="qa-icon" style="background:var(--accent)">${icon('calendar')}</div>View Calendar</div>
          <div class="qa-btn" onclick="navigateTo('reports')"><div class="qa-icon" style="background:var(--warning)">${icon('chart')}</div>Generate Report</div>
        </div>
        <div class="section-title" style="margin-top:20px;">System Status</div>
        <div class="status-row"><span>Database Status</span><span class="status-live"><span class="pulse"></span>Operational</span></div>
        <div class="status-row"><span>Google Sheet Status</span><span class="status-live"><span class="pulse"></span>Synced</span></div>
        <div class="status-row"><span>Email Service Status</span><span class="status-live"><span class="pulse"></span>Active</span></div>
        <div class="status-row"><span>Server Status</span><span class="status-live"><span class="pulse"></span>Online</span></div>
      </div>
      <div class="card">
        <div class="section-title">Recent Activity</div>
        ${activityLogs.slice(0,5).map(a=>`
          <div class="todo-row" style="align-items:flex-start;">
            <div class="kcard-avatar" style="margin-top:2px;">${a.user.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
            <div style="flex:1;"><div style="font-size:12.5px;font-weight:600;">${a.action}</div><div class="todo-date" style="margin-top:2px;">${a.time}</div></div>
          </div>`).join('')}
      </div>
    </div>
  `;
}
let charts = {};
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }
function initDashboardCharts(){
  destroyChart('overview'); destroyChart('priority');
  const ctx1 = document.getElementById('chart-overview');
  const textColor = getComputedStyle(document.body).getPropertyValue('--text-secondary');
  const gridColor = getComputedStyle(document.body).getPropertyValue('--border');
  if(ctx1){
    charts.overview = new Chart(ctx1, {
      type:'line',
      data:{labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
        datasets:[{label:'Tasks',data:[38,29,24,41,52,44,36],borderColor:'#7C3AED',backgroundColor:'rgba(124,58,237,0.15)',fill:true,tension:.4,pointRadius:3,pointBackgroundColor:'#7C3AED'}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{y:{grid:{color:gridColor},ticks:{color:textColor}},x:{grid:{display:false},ticks:{color:textColor}}}}
    });
  }
  const ctx2 = document.getElementById('chart-priority');
  if(ctx2){
    const high=todos.filter(t=>t.priority==='High').length, med=todos.filter(t=>t.priority==='Medium').length, low=todos.filter(t=>t.priority==='Low').length;
    charts.priority = new Chart(ctx2, {
      type:'doughnut',
      data:{labels:['High','Medium','Low'],datasets:[{data:[high,med,low],backgroundColor:['#EF4444','#F59E0B','#02B07A'],borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'72%',plugins:{legend:{display:false}}}
    });
  }
}
function quickToggleTodo(id){
  const t = todos.find(x=>x.id===id);
  if(t){
    t.status = t.status==='Completed'?'Pending':'Completed'; t.progress = t.status==='Completed'?100:0;
    sbUpdate('todos', id, {status:t.status, progress:t.progress});
  }
  renderPage();
  toast(t.status==='Completed'?'Marked as completed':'Marked as pending');
}

/* ============ APP BOOTSTRAP (must run after all declarations above) ============ */
async function bootApp(){
  document.body.setAttribute('data-theme','dark');
  renderShell();
  renderPage();
  // TODOs + user profiles live in Supabase. Occasions live ONLY in the Google Sheet via Apps Script —
  // there is no Supabase "occasions" table, so we never query one (that was the source of the 404s).
  const [remoteTodos, sheetOcc, remoteUsers] = await Promise.all([
    sbLoad('todos', todos, normalizeTodoRow),
    fetchOccasionsFromSheet(),
    sbLoad('profiles', users, normalizeUserRow),
  ]);
  todos = remoteTodos;
  if(sheetOcc && sheetOcc.length){ occasions = sheetOcc; }
  users = remoteUsers;
  await reconcileMyRole();
  if(sb){ toast(backendStatus.supabase==='on' ? 'Connected to Supabase' : 'Supabase connected, using demo data until tables exist'); }
  if(backendStatus.occSheet==='on'){ toast('Occasions synced from Google Sheet'); }
  else if(backendStatus.occSheet==='off'){ toast('Could not reach the Occasions Google Sheet — check the Apps Script deployment access. See console for details.','error'); }
  renderShell();
  renderPage();
}
// The `profiles` table (visible + editable on the Users page) is the source of truth for role —
// not Supabase auth metadata, which is easy to leave unset (e.g. accounts made directly in the
// Supabase dashboard, or signups from before role selection existed). This is what was causing a
// real Administrator account to behave like a Viewer with every button greyed out.
// It also self-bootstraps: if literally nobody in the real `profiles` table is an Administrator yet,
// whoever is currently logging in is promoted automatically. Queries Supabase directly (not the
// `users` array, which falls back to demo data — including fake "Administrator" rows — whenever the
// real table is empty, which would otherwise block the bootstrap check from ever firing).
async function reconcileMyRole(){
  const email = (currentSession?.user?.email||'').toLowerCase();
  if(!email || !sb) return;
  let myProfileRow = null, hasAnyAdmin = true; // default hasAnyAdmin=true: don't auto-promote if we can't verify
  try{
    const { data, error } = await sb.from('profiles').select('*');
    if(!error && Array.isArray(data)){
      hasAnyAdmin = data.some(r=>r.role==='Administrator');
      myProfileRow = data.find(r=>r.email && r.email.toLowerCase()===email) || null;
    }
  }catch(e){ /* table probably doesn't exist yet — leave hasAnyAdmin=true, safe no-op */ }

  let newRole = null;
  if(!hasAnyAdmin){
    newRole = 'Administrator';
    toast("No Administrator existed yet — you've been made the Administrator for this workspace.");
  }else if(myProfileRow && myProfileRow.role && myProfileRow.role !== state.currentUser.role){
    newRole = myProfileRow.role;
  }
  if(newRole && newRole !== state.currentUser.role){
    state.currentUser.role = newRole;
    const localMatch = users.find(u=>u.email && u.email.toLowerCase()===email);
    if(myProfileRow){
      if(localMatch) localMatch.role = newRole;
      sbUpdate('profiles', myProfileRow.id, {role:newRole});
    }else{
      const local = {id:idCounter.user++, name:state.currentUser.name, email:currentSession.user.email, role:newRole, status:'Active', online:true};
      users.push(local);
      sbInsert('profiles', {full_name:local.name, email:local.email, role:newRole, status:'Active'}).then(r=>{ if(r&&r.id) local.id=r.id; });
    }
    const meta = currentSession.user.user_metadata || {};
    sb.auth.updateUser({ data:{ ...meta, role:newRole } }).catch(()=>{});
  }
}
async function reloadFromBackend(){
  toast('Reloading from Supabase & Sheets...');
  const [remoteTodos, sheetOcc, remoteUsers] = await Promise.all([
    sbLoad('todos', todos, normalizeTodoRow),
    fetchOccasionsFromSheet(),
    sbLoad('profiles', users, normalizeUserRow),
  ]);
  todos = remoteTodos;
  if(sheetOcc && sheetOcc.length){ occasions = sheetOcc; }
  users = remoteUsers;
  renderPage(); toast('Data refreshed');
}
async function initApp(){
  document.body.setAttribute('data-theme','dark');
  if(!sb){
    // No Supabase client available (SDK failed to load) — skip auth gate, run in demo mode.
    bootApp();
    return;
  }
  document.getElementById('app').innerHTML = `<div class="auth-loading"><div class="spinner"></div>Checking session...</div>`;
  const { data:{ session } } = await sb.auth.getSession();
  currentSession = session;
  if(session){
    onAuthSuccess();
  }else{
    renderAuthScreen();
  }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_OUT'){ currentSession=null; renderAuthScreen(); }
  });
}
initApp();
